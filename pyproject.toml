[project]
name = "sam-contract-alerts"
version = "1.0.1"
description = "SAM.gov contract awards search and post to a chat channel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.18",
    "python-dateutil>=2.5.3",
    "six>=1.10",
    "urllib3>=2.8.0",
]

[project.scripts]
sam-contract-alerts = "sam_contract_alerts.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam_contract_alerts", "src/client"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = ["src/client/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["client", "sam_contract_alerts"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["src/client/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
